{{/*
  Same header idiom as db-schema / db-query: two logo SVGs, the wrong-theme one
  hidden by CSS, so the mark stays legible in both themes.
*/}}
<header class="site-header">
  <a class="brand" href="{{ "" | relURL }}">
    <img class="logo-dark"  src="{{ "img/logo_calcofi.svg"       | relURL }}" alt="CalCOFI" width="32" height="32">
    <img class="logo-light" src="{{ "img/logo_calcofi_light.svg" | relURL }}" alt="CalCOFI" width="32" height="32">
    <span>CalCOFI.io <span class="muted">usage</span></span>
  </a>

  <span class="spacer"></span>

  <nav class="header-links">
    <a href="https://calcofi.io/">home</a>
    <a href="https://status.calcofi.io/">status</a>
    <a href="https://github.com/CalCOFI/analytics">source</a>
  </nav>

  <button id="theme-toggle" type="button" aria-label="Toggle dark / light theme">🌓</button>
</header>
