<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">

  <!-- calcofi.io brand contract — https://calcofi.io/brand/v1/ (head.html verbatim,
       BEFORE the site stylesheet). The inline script sets the theme before first
       paint; theme.js then owns the toggle, the cross-subdomain cookie and the
       `cc:theme` event that app.js restyles the Leaflet map on. -->
  <link rel="icon" type="image/x-icon" href="https://calcofi.io/brand/v1/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://calcofi.io/brand/v1/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://calcofi.io/brand/v1/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://calcofi.io/brand/v1/apple-touch-icon.png">
  <script>(function(){var m=/[?&]theme=(dark|light)\b/.exec(location.search),c=/(?:^|;\s*)cc_theme=(dark|light)/.exec(document.cookie),s=null;try{s=localStorage.getItem("theme")}catch(e){}var t=(m&&m[1])||(c&&c[1])||(s==="light"||s==="dark"?s:null)||"dark",d=document.documentElement;d.dataset.theme=t;d.setAttribute("data-bs-theme",t);d.setAttribute("data-md-color-scheme",t==="dark"?"slate":"default");d.style.colorScheme=t})();</script>
  <link rel="stylesheet" href="https://calcofi.io/brand/v1/theme.css">
  <script defer src="https://calcofi.io/brand/v1/theme.js"></script>
  {{ $css := resources.Get "css/style.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">

  <!-- Google tag (gtag.js) — CalCOFI site property.
       Byte-identical to snippets/gtag-site.html, which every other CalCOFI
       static site copies; only content_group differs. The hostname guard keeps
       local previews out of the property. -->
  <script>
    window.__CC_GA = location.hostname.endsWith("calcofi.io")
                   && !navigator.webdriver;   // skip Playwright/Puppeteer/shot-scraper
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.ga_tag }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    if (window.__CC_GA) {
      gtag('js', new Date());
      gtag('config', '{{ .Site.Params.ga_tag }}', { content_group: '{{ .Site.Params.content_group }}' });
    }
  </script>

  {{ if .Params.product }}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@{{ .Site.Params.leaflet_version }}/dist/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@{{ .Site.Params.leaflet_version }}/dist/leaflet.js"></script>
  {{ end }}
</head>
