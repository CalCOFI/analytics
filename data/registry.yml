# Which product is which, in GA4 terms. HAND-MAINTAINED — the one file to edit
# when a product is added, renamed or retired.
#
# `slug` must match the `usage:` value on the product's card in
# CalCOFI.github.io/_data/products.yml, because that is what the card links to:
#   https://calcofi.io/analytics/<slug>/
#
# ATTRIBUTION — a GA4 row belongs to a product if either matches:
#   1. contentGroup ∈ content_groups   (preferred; set by the site/app itself)
#   2. hostName == host AND pagePath starts with any of path_prefixes
# The path leg is not redundant: `docs` is built by Quarto and `calcofi4r` /
# `calcofi4db` by pkgdown, none of which emit a content group we control, and
# every product's history *before* it was tagged is path-only.
#
# `content_groups` is a LIST because the app id and the card slug are not always
# the same string — see ucsb-larvae-dashboard.

# These are numeric PROPERTY ids — the `p`-prefixed number in a GA4 URL
# (analytics.google.com/analytics/web/#/p509537765/…), shown top-right under
# Admin → Property Settings.
#
# NOT the Measurement ID (G-0HVK8TDMCF) and NOT the Stream ID (e.g. 4625567227,
# the stream behind G-0HVK8TDMCF). Both are numbers you will meet first in the
# GA4 UI, and neither works: the Data API rejects them. Run the "List GA4
# properties" workflow to have the service account print the ids it can read.
properties:
  # G-VV117EV9ZT — the "apps" property: every Shiny app, plus db-query.
  apps: "509537765"
  # G-0HVK8TDMCF (display name "html", stream 4625567227) — the site property:
  # calcofi.io itself, docs, pkgdown sites, and the static Pages sites tagged
  # in 2026-07.
  site: "353746301"

products:
  # ── apps ───────────────────────────────────────────────────────────────────
  - slug: db-viz-hex
    title: db-viz-hex
    property: apps
    content_groups: [db-viz-hex]
    live_url: https://app.calcofi.io/db-viz-hex/
    path_prefixes: ["/db-viz-hex/"]
    # the only product with a server-side query log (see scripts/sheet.py)
    sheet_tab: db-viz-hex

  - slug: db-viz-cruise
    title: db-viz-cruise
    property: apps
    content_groups: [db-viz-cruise]
    live_url: https://app.calcofi.io/db-viz-cruise/
    path_prefixes: ["/db-viz-cruise/", "/datacheck/"]

  - slug: ctd-viz
    title: ctd-viz
    property: apps
    content_groups: [ctd-viz]
    live_url: https://app.calcofi.io/ctd/
    path_prefixes: ["/ctd/"]

  - slug: oceano
    title: oceano
    property: apps
    content_groups: [oceano]
    live_url: https://app.calcofi.io/oceano/
    path_prefixes: ["/oceano/"]

  - slug: pollutants
    title: pollutants
    property: apps
    content_groups: [pollutants]
    live_url: https://app.calcofi.io/pollutants/
    path_prefixes: ["/pollutants/"]

  - slug: db-viz-station
    title: db-viz-station
    property: site
    content_groups: [db-viz-station]
    live_url: https://calcofi.io/db-viz-station/
    host: calcofi.io
    path_prefixes: ["/db-viz-station/"]

  # the Explorer: one browser-native app across the five spatial grains (2026-08-29),
  # a static Pages app under calcofi.io/explore/. Its GA4 snippet is
  # calcofi4r::cc_ga_html("explore") = the APPS measurement id (G-VV117EV9ZT) with
  # content_group "explore" — so it reports to the apps property although it is
  # served from calcofi.io (filed under `site` at first, which found nothing).
  - slug: explore
    title: explore
    property: apps
    content_groups: [explore]
    live_url: https://calcofi.io/explore/
    host: calcofi.io
    path_prefixes: ["/explore/"]

  # static Pages app, served from the calcofi.io site property like
  # db-viz-station above — not app.calcofi.io, so it needs `host` + a
  # path_prefix to be separable from the rest of the site's traffic.
  - slug: ctd-transects
    title: ctd-transects
    property: site
    content_groups: [ctd-transects]
    live_url: https://calcofi.io/ctd-transects/
    host: calcofi.io
    path_prefixes: ["/ctd-transects/"]

  # ── services ───────────────────────────────────────────────────────────────
  # `request_host` opts a product into server-side request counts from the
  # Caddy access logs — the only way to see machine traffic, which is most of
  # what these two serve. Rendered separately from page views, never summed.
  - slug: erddap
    title: erddap
    property: site
    content_groups: [erddap]
    live_url: https://erddap.calcofi.io/
    host: erddap.calcofi.io
    path_prefixes: ["/erddap/"]
    request_host: erddap.calcofi.io

  - slug: storage
    title: storage
    property: site
    content_groups: [storage]
    live_url: https://storage.calcofi.io/
    host: storage.calcofi.io
    path_prefixes: ["/"]
    request_host: storage.calcofi.io

  # ── developer ──────────────────────────────────────────────────────────────
  - slug: db-query
    title: db-query
    property: apps          # db-query reports to the APPS property, not site
    content_groups: [db-query]
    live_url: https://calcofi.io/db-query/
    host: calcofi.io
    path_prefixes: ["/db-query/", "/query/"]

  - slug: db-schema
    title: db-schema
    property: site
    content_groups: [db-schema]
    live_url: https://calcofi.io/db-schema/
    host: calcofi.io
    path_prefixes: ["/db-schema/", "/schema/"]

  - slug: workflows
    title: workflows
    property: site
    content_groups: [workflows]
    live_url: https://calcofi.io/workflows/
    host: calcofi.io
    # only the landing index is tagged; the rendered Quarto notebooks are not,
    # so the path prefix is what captures them
    path_prefixes: ["/workflows/"]

  - slug: calcofi4r
    title: calcofi4r
    property: site
    content_groups: [calcofi4r]
    live_url: https://calcofi.io/calcofi4r/
    host: calcofi.io
    path_prefixes: ["/calcofi4r/"]

  - slug: calcofi4db
    title: calcofi4db
    property: site
    content_groups: [calcofi4db]
    live_url: https://calcofi.io/calcofi4db/
    host: calcofi.io
    path_prefixes: ["/calcofi4db/"]

  # ── documentation ──────────────────────────────────────────────────────────
  - slug: docs
    title: docs
    property: site
    # Quarto emits its own gtag config call; no content group to join on
    content_groups: []
    live_url: https://calcofi.io/docs/
    host: calcofi.io
    path_prefixes: ["/docs/"]

  # ── student contributions ──────────────────────────────────────────────────
  - slug: ucsb-larvae-dashboard
    title: Larvae Dashboard
    property: apps
    # the app id differs from the card slug — map it here rather than renaming
    # the app and orphaning its GA4 history
    content_groups: [larvae-dashboard]
    live_url: https://app.calcofi.io/2026-ucsb-larvae-dashboard/
    path_prefixes: ["/2026-ucsb-larvae-dashboard/"]

  - slug: ucsb-station-portal
    title: Station Data Portal
    property: site
    content_groups: [ucsb-station-portal]
    live_url: https://calcofi.io/2026-ucsb-station-data-portal/
    host: calcofi.io
    path_prefixes: ["/2026-ucsb-station-data-portal/"]

  - slug: ucla-monitoring-map
    title: CA Ocean & Coastal Monitoring Map
    property: site
    content_groups: [ucla-monitoring-map]
    live_url: https://calcofi.io/2026-ucla-cal-ocean-coastal-monitoring-map/
    host: calcofi.io
    path_prefixes: ["/2026-ucla-cal-ocean-coastal-monitoring-map/"]

  - slug: marmam
    title: Marine Mammal App
    property: apps
    content_groups: [marmam]
    live_url: https://app.calcofi.io/marmam/
    path_prefixes: ["/marmam/"]

  - slug: hypoxia-story
    title: Hypoxia Story
    property: site
    content_groups: [hypoxia-story]
    live_url: https://calcofi.io/hypoxia-story/
    host: calcofi.io
    path_prefixes: ["/hypoxia-story/"]

  - slug: saferseafood
    title: SaferSeafood App
    property: apps
    content_groups: [saferseafood]
    live_url: https://app.calcofi.io/SaferSeafood/
    path_prefixes: ["/SaferSeafood/"]

  - slug: capstone
    title: Capstone App
    property: apps
    content_groups: [capstone]
    live_url: https://app.calcofi.io/capstone/
    path_prefixes: ["/capstone/"]
